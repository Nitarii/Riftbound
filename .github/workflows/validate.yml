name: Validate
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          node --check core.mjs
          node --check draw-rules.mjs
          node --check priority-chain.mjs
          node --check effect-engine.mjs
          node --check effect-runtime.mjs
          node --check battlefield-rules.mjs
          node --check chat-scrolling.mjs
          node --check player-sequence.mjs
          node --check catalog.mjs
          node --check precons.mjs
          node --check narration.mjs
          node --check picker.mjs
          node --check manual-bridge.mjs
          node --check conversation.mjs
          node --check integrated-ai.mjs
          node --check game-knowledge.mjs
          node --check free-ai.mjs
          node --check local-ai-profiles.mjs
          node --check local-action-gate.mjs
          node --check player-actions.mjs
          node --check clarification.mjs
          node --check portable.mjs
          node --check uninstall-helper.mjs
          node --check update-transaction.mjs
          node --check update-helper.mjs
          node --check scripts/windows-update-smoke.mjs
          node --check portable-manager.mjs
          node --check release-policy.mjs
          node --check process-lifecycle.mjs
          node --check process-dashboard.mjs
          node --check whisper-local.mjs
          node --check local-voice.mjs
          node --check ai-turn.mjs
          node --check combat-engine.mjs
          node --check combat-voice.mjs
          node --check rune-payment.mjs
          node --check voice-session.mjs
          node --check app.mjs
          node --check server.mjs
          node --check remote.mjs
      - name: Run reducer tests
        run: node --test tests/*.test.mjs
      - name: Audit current card corpus (non-blocking; never claim complete fidelity)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: node scripts/audit-card-effects.mjs --output artifacts/card-effect-coverage.json
      - name: Upload card syntax coverage audit
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: printed-card-effect-coverage
          path: artifacts/card-effect-coverage.json
          if-no-files-found: ignore

