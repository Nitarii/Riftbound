name: Windows Companion
on:
  pull_request:
    branches: [main]
  push:
    tags: ['desktop-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Read package version
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content desktop/RiftboundCompanion.csproj -Raw)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "desktop-v$version") { throw 'Tag/version mismatch' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore build tools and install Windows runtime when needed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tools = (New-Item -ItemType Directory -Force dist/desktop-tools).FullName
          $compiler = Join-Path $tools 'innosetup.exe'
          $release = Invoke-RestMethod 'https://api.github.com/repos/jrsoftware/issrc/releases/tags/is-7_1_1'
          $asset = $release.assets | Where-Object { $_.name -like 'innosetup-*.exe' -and $_.digest -eq 'sha256:8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0' } | Select-Object -First 1
          if (!$asset) { throw 'Pinned Inno Setup asset not found' }
          curl.exe -fLsS --retry 3 $asset.browser_download_url -o $compiler
          if ((Get-FileHash $compiler).Hash -ne '8a5a6711c3766a6e5fb74f280ba0e3551e719ce94538d901fdbd1f8f9920b3f0') { throw 'Inno Setup checksum mismatch' }
          $arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /PORTABLE=1 /DIR="' + (Join-Path $tools 'inno') + '"'
          $p = Start-Process $compiler -ArgumentList $arguments -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "Inno setup exit $($p.ExitCode)" }
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-desktop.ps1 -Iscc (Resolve-Path dist/desktop-tools/inno/ISCC.exe)
      - uses: actions/upload-artifact@v4
        with:
          name: riftbound-windows-installer
          path: |
            dist/RiftboundCompanion-*-x64-Setup.exe
            dist/RiftboundCompanion-*-x64-Setup.exe.sha256
          if-no-files-found: error
      - name: Test installed WebView2 application
        shell: pwsh
        env:
          DESKTOP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright-core@1.58.2
          ./scripts/windows-installer-smoke.ps1 -Installer "dist/RiftboundCompanion-$env:DESKTOP_VERSION-x64-Setup.exe"

  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riftbound-windows-installer
          path: installer
      - name: Publish verified installer under the versioned tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" installer/* --verify-tag --title "Riftbound Companion $VERSION" --generate-notes
