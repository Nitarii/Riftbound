name: Riftbound download page
on:
  push:
    branches: [main]
    paths: ['pages/**', 'scripts/build-pages.mjs', 'assets/companion-icon.svg', '.github/workflows/pages.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ["Windows Companion"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: riftbound-pages

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
      - uses: actions/configure-pages@v5
      - run: node scripts/build-pages.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pages
      - uses: actions/deploy-pages@v4
        id: pages
