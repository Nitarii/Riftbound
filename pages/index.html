<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101620">
  <meta name="description" content="Riftbound Companion, l’application Windows pour jouer avec vos cartes physiques.">
  <title>Riftbound Companion</title>
  <link rel="icon" href="companion-icon.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #101620; color: #fff8e7; }
    * { box-sizing: border-box; }
    body {
      min-height: 100svh; margin: 0; padding: 28px; display: grid; place-items: center;
      background: radial-gradient(ellipse at 50% 8%, #28374c, transparent 70%),
        radial-gradient(ellipse at 15% 95%, #1d243d, transparent 62%), #101620;
    }
    main {
      width: min(100%, 680px); padding: clamp(26px, 7vw, 72px); text-align: center;
      border: 1px solid #526078; border-radius: 24px; background: #111a27ed;
      box-shadow: 0 18px 60px #060a1270;
    }
    img { display: block; margin-inline: auto; }
    h1 { font-size: clamp(2.1rem, 6vw, 4.2rem); letter-spacing: -.055em; line-height: .98; margin: 24px 0 18px; }
    p { color: #c8d2e1; font-size: 1.06rem; line-height: 1.55; max-width: 34ch; margin: 0 auto 25px; }
    a { color: #e4ce95; text-underline-offset: .2em; }
    a:focus-visible { outline: 2px solid #ffc966; outline-offset: 5px; }
    .download {
      display: inline-block; padding: 13px 20px; border-radius: 9px; text-decoration: none;
      color: #241c11; background: #e8c984; font-weight: 700;
    }
    .download:hover { background: #f4dc9f; }
    .download.unavailable { color: #c8d2e1; background: #253247; }
    footer { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 16px; margin-top: 20px; font-size: .84rem; color: #c8d2e1; }
  </style>
</head>
<body>
  <main>
    <img src="companion-icon.svg" alt="" width="78" height="78">
    <h1>Riftbound<br>Companion</h1>
    <p>Jouez avec vos cartes physiques face à un adversaire local. Annoncez vos actions par écrit ou au micro.</p>
    __DOWNLOAD__
    <footer><span>__RELEASE_VERSION__</span><a href="https://github.com/Nitarii/Riftbound/releases">Versions GitHub</a></footer>
  </main>
</body>
</html>
